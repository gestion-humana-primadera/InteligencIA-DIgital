.final-quote cite { display: block; margin-top: 4px; font-style: normal; font-size: 13px; font-weight: 800; color: var(--c-assist); text-transform: uppercase; letter-spacing: .04em; }

/* ---------- Pantallas muy angostas / bajas ---------- */
@media (max-width: 359px) {
  :root { --gutter: 12px; }
  .prompt { font-size: 18px; }
  .option { font-size: 16px; min-height: 50px; }
  .option-letter { width: 34px; height: 34px; }
  .timer { font-size: 20px; padding: 5px 10px; }
  .progress-dots li { width: 16px; }
  .avatar--sm { width: 48px; height: 48px; }
  .summary li { font-size: 13px; }
  .intro .avatar { width: 68px; height: 68px; }
}
@media (max-height: 620px) {
  .avatar--sm { width: 44px; height: 44px; }
  .dock { gap: 8px; padding-top: 8px; }
  .bubble--dock { font-size: 14px; }
  .play-main { padding-top: 10px; }
  .challenge { gap: 10px; }
  .countdown .avatar--lg { width: 72px; height: 72px; }
}

/* ---------- Desktop básico ---------- */
@media (min-width: 600px) {
  body { background: #EFE7E9; }
  #app { box-shadow: 0 0 0 1px var(--c-line), 0 10px 40px rgba(117, 24, 19, .08); }
}

/* ---------- Movimiento reducido ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .timer.is-danger { animation: none; }
  .next-progress { display: none; }
  .dots::after { content: "…"; animation: none; }
}

/* ---------- Modo de pruebas (config.js → BUILD.testMode) ---------- */
.test-badge {
  align-self: center;
  margin: 0 auto;
  padding: 3px 10px;
  border: 1px dashed var(--c-ink-2);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  color: var(--c-ink-2);
  background: var(--c-surface);
}
.test-note {
  font-size: 14px;
  color: var(--c-ink-2);
  text-align: center;
  padding: 10px 12px;
  border: 1px dashed var(--c-line);
  border-radius: var(--radius-sm);
}

/* ---------- Botón de sonido (encabezado) ---------- */
.header-right { display: flex; align-items: center; gap: 8px; flex: none; }
.sound-toggle {
  appearance: none;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 999px;
  border: 1px solid var(--c-line);
  background: var(--c-surface);
  color: var(--c-ink-2);
  cursor: pointer;
  touch-action: manipulation;
  padding: 0;
}
.sound-toggle .ico { width: 22px; height: 22px; }
.sound-toggle[aria-pressed="false"] { color: var(--c-line); border-style: dashed; }
@media (max-width: 359px) { .header-right { gap: 6px; } .play-header-row { gap: 8px; } }

/* ---------- Datos de un caso (reto de decisión) ---------- */
.details { display: flex; flex-direction: column; gap: 6px; }
.detail {
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  border-left: 4px solid var(--brand-rose);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 15px;
  line-height: 1.35;
}
.detail-label { display: block; font-weight: 800; color: var(--c-ink); }
.detail-text { color: var(--c-ink-2); }
/* Cuadrícula con palabras cortas (p. ej. nombres): letra un poco menor */
.options.is-grid-text .option { font-size: 17px; }

/**
 * Cronómetro global basado en timestamps (reloj monotónico).
 * No acumula decrementos: el tiempo restante siempre se calcula como deadline − ahora.
 * Sin dependencias de DOM.
 */

const monotonicNow = () =>
  (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

function createClock(durationMs, nowFn = monotonicNow) {
  let startAt = null;
  let deadline = null;
  let stoppedAt = null;

  return {
    now: nowFn,
    get running() { return startAt !== null && stoppedAt === null; },
    get startAt() { return startAt; },
    get deadline() { return deadline; },
    get durationMs() { return durationMs; },

    start(t = nowFn()) {
      startAt = t;
      deadline = t + durationMs;
      stoppedAt = null;
    },

    /** Único criterio de expiración. Empate (t === deadline) cuenta como expirado. */
    isExpired(t = nowFn()) {
      return deadline !== null && t >= deadline;
    },

    /** Congela el reloj en t (acotado al deadline). Idempotente: el primer stop gana. */
    stop(t = nowFn()) {
      if (startAt === null || stoppedAt !== null) return;
      stoppedAt = Math.min(t, deadline);
    },

    remainingMs(t = nowFn()) {
      if (startAt === null) return durationMs;
      const ref = stoppedAt !== null ? stoppedAt : t;
      return Math.max(0, deadline - ref);
    },

    elapsedMs(t = nowFn()) {
      if (startAt === null) return 0;
      const ref = stoppedAt !== null ? stoppedAt : Math.min(t, deadline);
      return Math.max(0, Math.min(durationMs, ref - startAt));
    },

    reset() { startAt = null; deadline = null; stoppedAt = null; }
  };
}

/** Segundos que se muestran (redondeo hacia arriba: 00:00 solo aparece al expirar). */
function displaySeconds(remainingMs) {
  return Math.max(0, Math.ceil(remainingMs / 1000));
}

  const s = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;

  el.timerValue.textContent = formatMMSS(displaySeconds(durationMs));
  el.timeup.hidden = true;
}

/* ----- Cronómetro global ----- */

function startTicker() {
  stopTicker();
  tick();
  tickInterval = setInterval(tick, 200);
  scheduleExpiry();
}

function stopTicker() {
  clearInterval(tickInterval);
  clearTimeout(expiryTimeout);
  tickInterval = null;
  expiryTimeout = null;
}

function scheduleExpiry() {
  clearTimeout(expiryTimeout);
  if (game.phase !== PHASE.PLAYING) return;
  const ms = game.clock.deadline - game.clock.now();
  expiryTimeout = setTimeout(tick, Math.max(0, ms) + 2);
}

function tick() {
  if (game.phase !== PHASE.PLAYING) return;
  const t = game.clock.now();
  if (game.clock.isExpired(t)) { handleExpire(); return; }
  const remaining = game.clock.remainingMs(t);
  renderTimer(remaining);
  if (remaining < 250) scheduleExpiry();
}

function renderTimer(remainingMs) {
  const secs = displaySeconds(remainingMs);
  el.timebarFill.style.transform = `scaleX(${Math.max(0, Math.min(1, remainingMs / durationMs))})`;
  if (secs === lastShownSecond) return;
  lastShownSecond = secs;
  el.timerValue.textContent = formatMMSS(secs);
  el.timer.setAttribute('aria-label', `Tiempo restante ${formatMMSS(secs)}`);

  if (secs <= TIMING.warnAtSeconds && secs > 0 && !warned60) {
    warned60 = true;                                     // una sola vez (DOC §16)
    el.timer.classList.add('is-warn');
    el.header.classList.add('is-warn');
    if (secs > TIMING.dangerAtSeconds) {
      showAlert(TEXT.warn60, 'warn');
      clearTimeout(alertTimeout);   // timer propio: NO se limpia al cambiar de reto
      alertTimeout = setTimeout(() => { if (!danger15) clearAlert(); }, TIMING.warnBannerMs);
    }
  }
  if (secs <= TIMING.dangerAtSeconds && secs > 0 && !danger15) {
    danger15 = true;
    el.timer.classList.add('is-danger');
    el.header.classList.add('is-danger');
    showAlert(TEXT.danger15, 'danger');
  }
}

function showAlert(text, kind) {
  el.timerAlert.className = 'timer-alert' + (kind === 'danger' ? ' is-danger' : '');
  el.timerAlert.replaceChildren(icon(kind === 'danger' ? 'i-clock' : 'i-spark'), node('span', null, text));
}
function clearAlert() { el.timerAlert.replaceChildren(); }

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && game && game.phase === PHASE.PLAYING) {
    tick();
    scheduleExpiry();
  }
});

/* ----- Fin de tiempo (00:00) ----- */

function handleExpire() {
  if (!game.expire()) return;                     // idempotente; ya terminó
  stopTicker();
  clearLocal();
  renderTimer(0);
  el.timerValue.textContent = '00:00';
  lockPlay();
  setDock('tiempo', TEXT.timeUp);
  el.timeup.hidden = false;
  clearTimeout(resultsTimeout);
  resultsTimeout = setTimeout(showResults, TIMING.timeUpOverlayMs);
}

function lockPlay() {
  el.options.querySelectorAll('button').forEach(b => { b.disabled = true; });
  el.media.querySelectorAll('button').forEach(b => { b.disabled = true; });
  el.btnConfirm.disabled = true;
  el.btnHelp.disabled = true;
  el.btnNext.disabled = true;
  el.nextProgress.classList.remove('run');
}

/* ----- Render de un reto ----- */

function renderChallenge() {
  clearLocal();
  ui = freshUi();
  const c = game.current();
  const i = game.index;
  const total = game.total;

  el.progressLabel.textContent = `${TEXT.challengeLabel} ${i + 1}/${total}`;
  el.progressDots.replaceChildren(...Array.from({ length: total }, (_, k) => {
    const li = node('li');
    if (k < i) li.className = 'is-done';
    else if (k === i) li.className = 'is-current';
    return li;
  }));

  el.chip.textContent = c.typeLabel || '';
  el.chip.hidden = !c.typeLabel;
  el.prompt.textContent = c.prompt;
  renderMedia(c);

  const maxLen = Math.max(...c.options.map(o => String(o.text).length));
  el.options.classList.toggle('is-grid', maxLen <= 10);
  el.options.classList.toggle('is-grid-text', maxLen > 6 && maxLen <= 10);
  el.options.replaceChildren(...c.options.map(o => {
    const b = node('button', 'option');
    b.type = 'button';
    b.dataset.id = o.id;
    b.setAttribute('aria-pressed', 'false');
    const body = node('span', 'option-body');
    body.append(node('span', 'option-text', o.text), node('span', 'option-tags'));
    b.append(node('span', 'option-letter', o.id), body);
    b.querySelector('.option-letter').setAttribute('aria-hidden', 'true');
    return b;
  }));

  el.dockActions.hidden = false;
  el.btnHelp.disabled = false;
  el.btnHelpLabel.textContent = TEXT.helpCta;
  el.btnNext.hidden = true;
  el.btnNext.disabled = false;
  el.nextProgress.classList.remove('run');
  setDock('neutral', TEXT.helpPrompt);

  updatePlayUi();

  el.challenge.classList.remove('enter');
  void el.challenge.offsetWidth;
  el.challenge.classList.add('enter');
  el.main.scrollTop = 0;
  try { el.prompt.focus({ preventScroll: true }); } catch (_) { /* noop */ }
}

function renderMedia(c) {
  el.media.replaceChildren();
  if (c.image && c.image.src) {
    if (hasFailed(c.image.src)) { renderImageFallback(c); return; }
    const img = node('img', 'media-img');
    img.alt = c.image.alt || '';
    img.decoding = 'async';
    el.media.appendChild(img);
    setImage(img, c.image.src, null, () => {
      if (game.current() === c && !game.gameOver) renderImageFallback(c);
    });
  }
  if (Array.isArray(c.details) && c.details.length) {
    const list = node('ul', 'details');
    list.setAttribute('aria-label', 'Datos del caso');
    c.details.forEach(d => {
      const li = node('li', 'detail');
      li.append(node('span', 'detail-label', d.label), node('span', 'detail-text', d.text));
      list.appendChild(li);
    });
    el.media.appendChild(list);
  }
  if (c.sequence) {
    const seq = node('p', 'sequence', c.sequence);
    seq.setAttribute('aria-label', 'Secuencia: ' + c.sequence.replace(/·/g, ',').replace('?', 'signo de interrogación'));
    el.media.appendChild(seq);
  }
}

function renderImageFallback(c) {
  ui.imageFailed = true;
  const box = node('div', 'media-fallback');
  box.setAttribute('role', 'status');
  const title = node('p', 'media-fallback-title');
  title.append(icon('i-image'), node('span', null, TEXT.imageError));
  box.appendChild(title);
  if (c.image && c.image.fallbackText) box.appendChild(node('p', null, c.image.fallbackText));
  const skip = node('button', 'btn btn--secondary', TEXT.skipCta);
  skip.type = 'button';
  skip.addEventListener('click', onSkip);
  box.appendChild(skip);
  el.media.replaceChildren(box);
  if (c.sequence) el.media.appendChild(node('p', 'sequence', c.sequence));
  updatePlayUi();
}

/** Deriva el estado visual de opciones/botones del estado del juego. */
function updatePlayUi() {
  const step = game.step;
  const selected = game.selected;
  const fb = ui.feedback;
  const locked = game.gameOver && !fb;
  const optionsEnabled = !fb && !locked && (step === STEP.ACTIVE || step === STEP.ANSWER_SELECTED);
  const c = game.current();

  el.options.querySelectorAll('.option').forEach(b => {
    const id = b.dataset.id;
    const opt = c.options.find(o => o.id === id);
    const isSel = selected === id;
    const isSug = ui.suggested === id;
    b.disabled = !optionsEnabled;
    b.setAttribute('aria-pressed', String(isSel));
    b.classList.toggle('is-suggested', isSug);
    b.classList.toggle('is-correct', !!fb && id === fb.correctOption);
    b.classList.toggle('is-wrong', !!fb && isSel && !fb.correct);
    b.classList.toggle('is-dim', !!fb && id !== fb.correctOption && !isSel);

    const tags = b.querySelector('.option-tags');
    const list = [];
    const labelParts = [`Opción ${id}: ${opt ? opt.text : ''}`];
    if (isSug) { list.push(['tag tag--suggest', 'i-spark', TEXT.suggestedShort]); labelParts.push(TEXT.suggestedBadge); }
    if (fb && isSel) {
      list.push([fb.correct ? 'tag tag--ok' : 'tag tag--bad', fb.correct ? 'i-check' : 'i-x', TEXT.yourAnswer]);
      labelParts.push(TEXT.yourAnswer);
    }
    if (fb && id === fb.correctOption) { list.push(['tag tag--ok', 'i-check', TEXT.correctAnswer]); labelParts.push(TEXT.correctAnswer); }
    tags.replaceChildren(...list.map(([cls, ic, txt]) => { const t = node('span', cls); t.append(icon(ic), node('span', null, txt)); return t; }));
    b.setAttribute('aria-label', labelParts.join('. '));
  });

  const canConfirm = !fb && !locked && step === STEP.ANSWER_SELECTED && !!selected;
  el.btnConfirm.disabled = !canConfirm;
  el.dockActions.hidden = !!fb;

  const used = game.currentAnswer().assistantUsed;
  el.btnHelp.disabled = used || !!fb || locked || step === STEP.ASSISTANT_ANALYZING;
  el.btnHelpLabel.textContent = used ? TEXT.helpUsedShort : TEXT.helpCta;
  el.btnHelp.setAttribute('aria-label', used ? TEXT.helpUsed : TEXT.helpCta);
  el.btnHelp.toggleAttribute('data-used', used);
  el.media.querySelectorAll('button').forEach(b => { b.disabled = !!fb || locked || step === STEP.ASSISTANT_ANALYZING; });
}

/* ----- Interacciones ----- */

function expiredGuard(t) {
  if (game.phase === PHASE.PLAYING && game.clock.isExpired(t)) { handleExpire(); return true; }
  return false;
}

function onOptionTap(e) {
  const b = e.target.closest('.option');
  if (!b || b.disabled) return;
  const t = now();
  if (expiredGuard(t)) return;
  if (game.select(b.dataset.id, t)) updatePlayUi();
}

/** Desplaza una opción a la vista si quedó oculta tras el dock (sin mover el foco). */
function revealOption(id) {
  const opt = el.options.querySelector(`.option[data-id="${id}"]`);
  if (!opt) return;
  const r = opt.getBoundingClientRect();
  const m = el.main.getBoundingClientRect();
  const pad = 8;
  if (r.bottom > m.bottom) el.main.scrollTop += Math.min(r.bottom - m.bottom + pad, r.top - m.top - pad);
  else if (r.top < m.top) el.main.scrollTop -= (m.top - r.top + pad);
}

function onHelp() {
  const t = now();
  const res = game.requestAssist(t);             // registra la consulta y bloquea doble toque
  if (!res.ok) { if (res.reason === 'expired') handleExpire(); return; }
  setDock('analizando', TEXT.analyzing, 'is-analyzing');
  sfx.assist();
  updatePlayUi();
  const delay = TIMING.assistMinMs + Math.random() * (TIMING.assistMaxMs - TIMING.assistMinMs);
  later(() => {
    const reco = game.completeAssist();
    if (!reco) return;
    ui.suggested = reco.option;
    const strong = node('strong', null, TEXT.recommendation(reco.option, '').replace(/\s*porque\s*$/, ''));
    setDock('pensando', [strong, document.createTextNode(` porque ${reco.reason}`)], 'is-reco');
    updatePlayUi();
    revealOption(reco.option);
  }, delay);
}

function onConfirm() {
  const t = now();
  const res = game.confirm(t);                   // única fuente de verdad, valida contra el deadline
  if (!res.ok) { if (res.reason === 'expired') handleExpire(); return; }
  if (res.isLast) {                              // reto 5: el tiempo se detiene en este instante
    stopTicker();
    renderTimer(game.clock.remainingMs());
    el.timer.classList.remove('is-danger');      // reloj detenido: sin pulso de urgencia
  }
  showFeedback(res);
}

function showFeedback(res) {
  const c = game.current();
  ui.feedback = res;
  if (res.correct) sfx.correct(); else sfx.incorrect();
  updatePlayUi();

  const head = node('span', 'bubble-strong');
  head.append(icon(res.correct ? 'i-check' : 'i-x'), node('span', null, res.correct ? TEXT.correct : TEXT.incorrect));
  const detail = node('span', 'bubble-detail', res.correct ? c.feedbackCorrect : c.feedbackIncorrect);
  setDock(res.correct ? 'celebrando' : 'error', [head, detail], res.correct ? 'is-ok' : 'is-bad');

  el.dockActions.hidden = true;
  el.btnNext.hidden = false;
  el.btnNext.disabled = false;
  el.btnNextLabel.textContent = res.isLast ? TEXT.resultsCta : TEXT.nextCta;
  el.nextProgress.style.animationDuration = `${TIMING.feedbackAutoAdvanceMs}ms`;
  el.nextProgress.classList.remove('run');
  void el.nextProgress.offsetWidth;
  el.nextProgress.classList.add('run');
  try { el.btnNext.focus({ preventScroll: true }); } catch (_) { /* noop */ }
  revealOption(res.correctOption);           // después de que el dock cambió de altura
  later(onNext, TIMING.feedbackAutoAdvanceMs);
}

function onNext() {
  if (el.btnNext.hidden || el.btnNext.disabled) return;
  if (game.gameOver) {
    if (!game.metrics().timeExpired) showResults();
    return;
  }
  if (expiredGuard(now())) return;
  if (game.advance()) renderChallenge();          // guard: solo avanza desde FEEDBACK (una vez)
}

function onSkip() {
  const t = now();
  const res = game.skip(t);
  if (!res.ok) { if (res.reason === 'expired') handleExpire(); return; }
  if (res.isLast) { stopTicker(); showResults(); }
  else renderChallenge();
}

/* =========================================================
   RESULTS
   ========================================================= */

function stat(label, value, opts = {}) {
  const row = node('div', 'stat' + (opts.hero ? ' stat--hero' : ''));
  const dt = node('dt', null, label);
  const dd = node('dd', opts.isText ? 'is-text' : null, value);
  row.append(dt, dd);
  return row;
}

function showResults() {
  if (resultsShown) return;
  resultsShown = true;
  stopTicker();
  clearLocal();
  clearTimeout(resultsTimeout);
  el.timeup.hidden = true;

  const m = game.metrics();
  const n = (v) => String(Number.isFinite(v) ? v : 0);
  el.resultsTitle.textContent = m.timeExpired ? TEXT.resultsTimeUp : TEXT.resultsCompleted;
  el.resultsSub.textContent = m.timeExpired ? TEXT.resultsTimeUpSub : TEXT.resultsCompletedSub;
  setAvatar(el.resultsAvatar, m.timeExpired ? 'tiempo' : 'celebrando');

  const rows = [stat(TEXT.statCorrect, `${n(m.scoreCorrect)}/${n(m.total)}`, { hero: true })];
  rows.push(m.timeExpired
    ? stat(TEXT.statTimeExpired, formatMMSS(Math.round(durationMs / 1000)))
    : stat(TEXT.statTimeUsed, formatMMSS(m.elapsedSeconds)));
  if (m.completedChallenges < m.total) rows.push(stat(TEXT.statCompleted, `${n(m.completedChallenges)}/${n(m.total)}`));
  rows.push(stat(TEXT.statSolo, n(m.solvedWithoutAssistant)));
  rows.push(stat(TEXT.statTogether, n(m.solvedWithAssistant)));
  rows.push(stat(TEXT.statUses, `${n(m.assistantUses)}/${n(m.total)}`));
  el.stats.replaceChildren(...rows);

  showScreen('results');
  el.screens.results.querySelector('.results-scroll').scrollTop = 0;
  try { el.resultsTitle.focus({ preventScroll: true }); } catch (_) { /* noop */ }
}

function onReplay() {
  stopTicker();
  clearLocal();
  clearTimeout(resultsTimeout);
  game.reset();
  resultsShown = false;
  ui = freshUi();
  resetTimerUi();
  setStartReady(true);
  showScreen('welcome');
}

/* =========================================================
   INIT
   ========================================================= */

function renderSoundToggle() {
  const on = soundOn();
  el.btnSound.setAttribute('aria-pressed', String(on));
  el.btnSound.setAttribute('aria-label', on ? TEXT.soundOn : TEXT.soundOff);
  el.btnSound.querySelector('use').setAttribute('href', on ? '#i-sound' : '#i-mute');
}

function fatal() {
  // Nunca mostrar errores técnicos al participante.
  setStartReady(false);
  el.startLabel.textContent = 'No disponible';
  const micro = $('start-micro');
  if (micro) micro.textContent = 'No pudimos preparar el reto. Recarga la página para intentarlo de nuevo.';
}

function init() {
  game = createGame(challenges, { durationMs });
  bindStaticText();
  setStartReady(false);

  if (!challenges.length) { fatal(); return; }

  el.btnStart.addEventListener('click', onStart);
  el.options.addEventListener('click', onOptionTap);
  el.btnHelp.addEventListener('click', onHelp);
  el.btnConfirm.addEventListener('click', onConfirm);
  el.btnNext.addEventListener('click', onNext);
  el.btnReplay.addEventListener('click', onReplay);
  configureSound(SOUND);
  renderSoundToggle();
  el.btnSound.addEventListener('click', () => { setSound(!soundOn()); renderSoundToggle(); });

  const srcs = [...Object.values(avatarSrc), ...challenges.map(c => c.image && c.image.src), ...Object.values(BRAND).map(b => b && b.src)];
  preload(srcs, TIMING.preloadTimeoutMs).then(() => {
    // Reasigna avatares: si alguno falló, ya queda el placeholder antes de empezar.
    document.querySelectorAll('[data-avatar]').forEach(img => setAvatar(img, img.dataset.avatar));
    setStartReady(true);
  });

  if (QA) {
    window.__RETO_QA__ = { game, durationMs, TIMING, STEP, PHASE, showResults, handleExpire };
    console.info('[Reto 100tífico] Modo QA activo', { durationMs, qaFail });
  }
}

window.addEventListener('error', (e) => { console.error('[Reto 100tífico]', e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { console.error('[Reto 100tífico]', e.reason); });

try { init(); } catch (err) { console.error('[Reto 100tífico] init', err); fatal(); }

})();
})();

</script>
